<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}mse-viewer{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css?v=phase2p3i-20260524">
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong><a href="/">mse-viewer</a></strong></li>
            </ul>
            <ul>
                <li><a href="/upload">Upload</a></li>
                <li><a href="/cards">Cards</a></li>
                <li><a href="/tokens">Tokens</a></li>
                <li><a href="/keywords">Keywords</a></li>
                <li><a href="/decks">Decks</a></li>
                <li><a href="/log">Log</a></li>
                <li><a href="/related/missing">Missing</a></li>
                <li class="additional-toggle">
                    <label><input type="checkbox" id="additional-info-toggle"> Additional info</label>
                </li>
            </ul>
        </nav>
    </header>
    <script>
        // Phase 1.6 prompt 4 item 5: persist the "Additional information"
        // toggle across pages. The body class hides .additional-info rows /
        // columns via CSS; localStorage keeps the choice between visits.
        (function () {
            var KEY = "mseViewer.showAdditional";
            var checkbox = document.getElementById("additional-info-toggle");
            var on = localStorage.getItem(KEY) === "1";
            document.body.classList.toggle("show-additional", on);
            if (checkbox) {
                checkbox.checked = on;
                checkbox.addEventListener("change", function () {
                    document.body.classList.toggle("show-additional", checkbox.checked);
                    localStorage.setItem(KEY, checkbox.checked ? "1" : "0");
                });
            }
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
